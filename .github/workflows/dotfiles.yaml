name: dotfiles

on: [push]

jobs:
  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: ./install.sh
      - name: Verify Neovim starts cleanly
        run: |
          output=$(nvim --headless -c 'qa!' 2>&1)
          echo "$output"
          if echo "$output" | grep -qE '^(Error|E[0-9]+:)'; then
            echo "::error::Neovim reported errors on startup"
            exit 1
          fi
      - name: Verify installed tools
        # Run under a non-interactive zsh, which reads ~/.zshenv but not
        # ~/.zshrc, so this also covers the PATH that scripts and subprocesses
        # get rather than only the one an interactive session sees.
        shell: zsh -e {0}
        run: |
          failed=0
          for tool in claude nvim tmux zsh tree-sitter bazel ibazel buildifier bat go gopls \
            rustup rust-analyzer cargo fzf difft rg fd clang-format tldr starpls \
            lua-language-server bash-language-server shfmt zig zls \
            elan lean lake; do
            if command -v "$tool" >/dev/null; then
              echo "  $tool"
            else
              echo "::error::$tool is not installed"
              failed=1
            fi
          done
          exit $failed
