set -g base-index 1
set -g repeat-time 0

# Maintain gapless sequence of window numbers.
set -g renumber-windows on

set -g mode-keys vi

# Let programs in a pane send escape sequences straight to Ghostty, so
# Claude Code's OSC 777 desktop notifications survive the tmux layer. 'all'
# rather than 'on' so a pane in a background window can notify too.
set -g allow-passthrough all

# Use <Ctrl+s> for prefix.
unbind C-b
set -g prefix C-s
bind-key C-s send-prefix

# Use <Prefix:h> to split the pane horizontally.
bind h split-window -h -c "#{pane_current_path}"
unbind %

# Use <Prefix:v> to split the pane vertically.
bind v split-window -v -c "#{pane_current_path}"
unbind '"'

# Use <Prefix:%> to swap panes.
bind % swap-pane -s '!' -t $TMUX_PANE

# Use <Prefix:Ctrl+t> to reload tmux config.
bind C-t source-file ~/.config/tmux/tmux.conf \; display-message 'tmux conf reloaded.'

# Use <Prefix:Ctrl+z> to reload zsh in the current pane.
bind C-z respawn-pane -k

# Use <Prefix:T> to toggle between the dark and light theme.
bind T run-shell '~/.config/bin/theme toggle'

# Use <v> to start and <y> to yank a selection in copy mode.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Configure status bar. Before the plugins, as tmux-agent-status adds its
# segment to status-right when it loads. Its window marker is placed here
# instead, as the plugin puts the space after the marker rather than before.
set -g @agent-status-modify-window-format off
set -g status-position 'top'
set -g status-justify 'left'
set -g status-left ''
set -g status-right '%H:%M'
set -g window-status-separator ' • '
set -g window-status-format '#W#{?@agent_mark, #{@agent_mark},}'
set -g window-status-current-format '#W#[fg=#{@theme-accent}]#{?window_zoomed_flag, 󰊓,}#[default]#{?@agent_mark, #{@agent_mark},}'

# Configure pane borders, the pane number overlay and clock mode. Named ANSI
# colors, so they follow the terminal palette of the current theme.
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=blue'
set -g display-panes-colour black
set -g display-panes-active-colour brightblack
set -g clock-mode-colour cyan

# Apply the colors of the theme picked by ~/.config/bin/theme.
if-shell '[ "$(cat ~/.local/state/dotfiles/theme 2>/dev/null)" = light ]' \
  'source-file ~/.config/tmux/theme-light.conf' \
  'source-file ~/.config/tmux/theme-dark.conf'

# Configure plugins. vim-tmux-navigator also binds <Prefix:Ctrl+l> to clear
# the screen, as its <Ctrl+l> moves to the pane on the right.
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'gs/tmux-agent-status'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tpm'
run '~/.config/tmux/plugins/tpm/tpm'

# Override tmux-agent-status' popup keys to put the preview on the right. The
# plugin passes --preview-window=down on the command line, which beats
# FZF_DEFAULT_OPTS, so the preview is moved once fzf has started.
bind a display-popup -E -w 80% -h 70% -T ' agents ' "FZF_DEFAULT_OPTS=\"\$FZF_DEFAULT_OPTS --bind 'start:change-preview-window(right,67%,wrap,follow)'\" ~/.config/tmux/plugins/tmux-agent-status/bin/agent-status pick '#{client_name}'"
bind A display-popup -E -w 80% -h 70% -T ' agents ' "FZF_DEFAULT_OPTS=\"\$FZF_DEFAULT_OPTS --bind 'start:change-preview-window(right,67%,wrap,follow)'\" ~/.config/tmux/plugins/tmux-agent-status/bin/agent-status pick '#{client_name}'"
