# Status bar and message colors for the dark Nord theme. Sourced by tmux.conf
# and by the `theme` script, so every option set here must also be set in
# theme-light.conf.

# Set by tmux too, so the cursor of a pane that is already open switches with
# the theme rather than relying on Ghostty's config reload to update it.
set -g cursor-colour '#ECEFF4'
set -g prompt-cursor-colour '#D8DEE9'
set -g status-style 'bg=#2E3440,fg=#585b70'
set -g window-status-style 'bg=#2E3440,fg=#585b70'
set -g window-status-current-format '#[bg=#2E3440,fg=#D8DEE9]#W#[fg=#81A1C1,bg=#2E3440]#{?window_zoomed_flag, 󰊓,}#[fg=#2E3440,bg=default]'
set -g message-style 'bg=brightblack,fg=cyan'
set -g message-command-style 'bg=brightblack,fg=cyan'
