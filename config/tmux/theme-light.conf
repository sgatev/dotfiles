# Status bar and message colors for the light Rose Pine Dawn theme. Sourced by
# tmux.conf and by the `theme` script, so every option set here must also be set
# in theme-dark.conf.

# Set by tmux too, so the cursor of a pane that is already open switches with
# the theme rather than relying on Ghostty's config reload to update it.
set -g cursor-colour '#575279'
set -g prompt-cursor-colour '#575279'
set -g status-style 'bg=#FAF4ED,fg=#797593'
set -g window-status-style 'bg=#FAF4ED,fg=#797593'
set -g window-status-current-style 'bg=#FAF4ED,fg=#575279'
set -g @theme-accent '#286983'
set -g message-style 'bg=#F2E9E1,fg=#575279'
set -g message-command-style 'bg=#F2E9E1,fg=#575279'
